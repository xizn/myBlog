<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursor Automation Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
    }
    .card {
      text-align: center;
      padding: 3rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #c4a574; }
    p { color: #999; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Agent Preview</h1>
    <p>将构建产物放入 public/previews/[项目id]/ 即可在此预览</p>
  </div>
</body>
</html>
